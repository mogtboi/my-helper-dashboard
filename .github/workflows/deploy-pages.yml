# Deploy my helper dashboard PWA to GitHub Pages
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 08:00 Asia/Hong_Kong (UTC+8, no daylight saving)
    - cron: "0 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Refresh movie showtimes
        continue-on-error: true
        run: node scripts/fetch-movies.mjs

      - name: Install & build
        env:
          VITE_BASE_PATH: /my-helper-dashboard/
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
